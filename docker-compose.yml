services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-${KIMI_API_KEY:-}}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      LLM_MODEL: ${LLM_MODEL:-glm-5.1}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_MODEL: ${VISION_MODEL:-qwen3.6-plus}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k2.5}
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
